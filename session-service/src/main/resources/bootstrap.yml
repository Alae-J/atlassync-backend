spring:
  application:
    name: session-service
  config:
    import: optional:vault://
  cloud:
    vault:
      uri: ${VAULT_ADDR:http://localhost:8200}
      token: ${VAULT_TOKEN:root}
      authentication: TOKEN
      kv:
        enabled: true
        backend: secret
        default-context: atlassync/stripe
        application-name: ''
      fail-fast: false
