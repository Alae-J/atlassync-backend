# AtlasSync client-facing backend — production stack (big-data pipeline excluded).
# Only the gateway is published, bound to 127.0.0.1:18080 so it is reachable
# exclusively through the host's Caddy (TLS) at https://atlassync.alae-j.me.
# Run with:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: atlassync

networks:
  atlasnet:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:

services:
  postgres:
    image: postgres:16.13-alpine
    restart: unless-stopped
    networks: [atlasnet]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlassync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlassync}
      POSTGRES_DB: atlassync
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlassync}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    networks: [atlasnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 128m

  kafka:
    image: confluentinc/cp-kafka:8.2.0
    restart: unless-stopped
    networks: [atlasnet]
    # TUNNEL listener: localhost-only on the host, reached from a dev machine over
    # an SSH tunnel so the local big-data pipeline can consume prod purchases.
    ports:
      - "127.0.0.1:39092:39092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,TUNNEL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,TUNNEL://kafkatunnel:39092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,TUNNEL://0.0.0.0:39092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: 768m

  vault:
    image: hashicorp/vault:1.21.4
    restart: unless-stopped
    networks: [atlasnet]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 128m

  vault-init:
    image: hashicorp/vault:1.21.4
    networks: [atlasnet]
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - ./infrastructure/vault/init-vault.sh:/init-vault.sh:ro
    entrypoint: ["/bin/sh", "/init-vault.sh"]
    restart: "no"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: auth-service }
    image: atlassync/auth-service:latest
    restart: unless-stopped
    networks: [atlasnet]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      JAVA_OPTS: -Xmx256m -Xms96m -XX:+UseSerialGC -Xss512k
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlassync_auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlassync}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlassync}
      JWT_SECRET: ${JWT_SECRET}
      OTP_DELIVERY_PROVIDER: ${OTP_DELIVERY_PROVIDER:-log}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    mem_limit: 384m

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: product-service }
    image: atlassync/product-service:latest
    restart: unless-stopped
    networks: [atlasnet]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      JAVA_OPTS: -Xmx288m -Xms96m -XX:+UseSerialGC -Xss512k
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlassync_product
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlassync}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlassync}
      SPRING_DATA_REDIS_HOST: redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    mem_limit: 416m

  session-service:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: session-service }
    image: atlassync/session-service:latest
    restart: unless-stopped
    networks: [atlasnet]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      vault: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
    environment:
      JAVA_OPTS: -Xmx288m -Xms96m -XX:+UseSerialGC -Xss512k
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlassync_session
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlassync}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlassync}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-mad}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    mem_limit: 416m

  cart-service:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: cart-service }
    image: atlassync/cart-service:latest
    restart: unless-stopped
    networks: [atlasnet]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      product-service: { condition: service_started }
      session-service: { condition: service_started }
    environment:
      JAVA_OPTS: -Xmx256m -Xms96m -XX:+UseSerialGC -Xss512k
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlassync_cart
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlassync}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlassync}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_PRODUCT_ADDRESS: static://product-service:9082
      GRPC_SESSION_ADDRESS: static://session-service:9084
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    mem_limit: 384m

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: gateway }
    image: atlassync/gateway:latest
    restart: unless-stopped
    networks: [atlasnet]
    depends_on:
      auth-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      cart-service: { condition: service_healthy }
      session-service: { condition: service_healthy }
    environment:
      JAVA_OPTS: -Xmx256m -Xms96m -XX:+UseSerialGC -Xss512k
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URI: http://auth-service:8081
      PRODUCT_SERVICE_URI: http://product-service:8082
      CART_SERVICE_URI: http://cart-service:8083
      CART_SERVICE_WS_URI: ws://cart-service:8083
      SESSION_SERVICE_URI: http://session-service:8084
      # big-data excluded: /api/analytics has no upstream and will 503 by design
      ANALYTICS_API_URI: http://127.0.0.1:8089
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    mem_limit: 384m
